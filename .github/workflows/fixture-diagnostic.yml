name: 无模型跨宿主参考解诊断

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          python-version: '3.13'
          enable-cache: true
      - name: 安装冻结评测依赖
        run: uv sync --frozen
      - name: 固定八次无模型试验
        shell: bash
        run: |
          timeout --signal=INT --kill-after=60s 25m \
            uv run --no-sync python scripts/diagnose_fixtures.py \
            --cache "$RUNNER_TEMP/fixture-source" \
            --output "$RUNNER_TEMP/fixture-diagnostic"
      - name: 保存最小诊断证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixture-diagnostic/public/
          if-no-files-found: warn
          retention-days: 14
