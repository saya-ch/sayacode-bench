# 只在公开 saya-ch/sayacode-bench 派发：标准 runner 不消耗私有 2000 免费分钟。
# 公开工件白名单：固定公开 MIT 任务、oracle/nop 原生日志、资源及公共宿主元数据。
# 不读取或复制私有 wheel/profile/账单/用户或模型轨迹；不调用供应商 Secret 或模型。
# 公开标准宿主 4 CPU/16 GiB，模型私有宿主 2 CPU/8 GiB；不当作同物理硬件。
# 容器 CPU/RAM/swap 仍用官方原值并逐次测量；公开材料保留三天，不自动删除。
# 首批只读 Actions 历史防止误重启；不声称能发现被人工删除的 workflow run。
name: 无模型资格检查单批
run-name: qualification ${{ inputs.study_id }}
on:
  workflow_dispatch:
    inputs:
      public_source_sha:
        description: 已审阅的公开源码完整小写 SHA；续批不可更换
        type: string
        required: true
      study_id:
        description: 固定 Linux bundle 的 study ID；续批不可更换
        type: string
        required: true
      image_os:
        description: 冻结的 runner ImageOS；续批不可更换
        type: string
        required: true
      image_version:
        description: 冻结的 runner ImageVersion；续批不可更换
        type: string
        required: true
      max_new_controls:
        description: 本批最多新增 controls；最多一个任务，不改变三加一规则
        type: number
        default: 4
        required: true
      resume_run_id:
        description: 续批原 artifact 所属同一公开仓库 run ID；首批留空
        type: string
        default: ''
      resume_artifact:
        description: 续批原完整 bundle artifact 名称；首批留空
        type: string
        default: ''
      resume_sha256:
        description: 原 bundle.tar.gz 的完整 SHA256；首批留空
        type: string
        default: ''
      acknowledge_execution:
        description: 确认本次公开标准 runner 的无模型资格批次；不消耗私有 Actions 额度
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: qualification-${{ inputs.study_id }}
  cancel-in-progress: false
jobs:
  qualify:
    if: inputs.acknowledge_execution && github.repository == 'saya-ch/sayacode-bench'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_SHA: ${{ inputs.public_source_sha }}
      STUDY_ID: ${{ inputs.study_id }}
      EXPECTED_IMAGE_OS: ${{ inputs.image_os }}
      EXPECTED_IMAGE_VERSION: ${{ inputs.image_version }}
      MAX_NEW_CONTROLS: ${{ inputs.max_new_controls }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      RESUME_ARTIFACT: ${{ inputs.resume_artifact }}
      RESUME_SHA: ${{ inputs.resume_sha256 }}
    steps:
      - name: 实时核实指定公开仓库、首次尝试与显式续批参数
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STUDY_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,80}$ ]]
          mkdir -p "$RUNNER_TEMP/evidence"
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/evidence/repository.json"
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'evidence/repository.json').read_text(encoding='utf-8'))
          assert d.get('full_name')=='saya-ch/sayacode-bench' and d.get('private') is False and d.get('visibility')=='public'
          run,artifact,sha=(os.environ[k] for k in ('RESUME_RUN_ID','RESUME_ARTIFACT','RESUME_SHA'))
          assert not any((run,artifact,sha)) or (run.isdigit() and int(run)>0 and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,150}',artifact) and re.fullmatch(r'[0-9a-f]{64}',sha))
          assert os.environ['MAX_NEW_CONTROLS'].isdigit() and 1<=int(os.environ['MAX_NEW_CONTROLS'])<=256
          PY
          if test -z "$RESUME_ARTIFACT"; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/qualify-study.yml/runs?per_page=100" \
              > "$RUNNER_TEMP/evidence/actions-history.json"
          fi
          echo "JOB_DEADLINE_EPOCH=$(( $(date +%s) + 19800 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: execution
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: saya-ch/sayacode-bench
          ref: ${{ inputs.public_source_sha }}
          path: bench
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
          python-version: '3.13.12'
          enable-cache: false
      - name: 安装固定依赖并准备 fresh runner 磁盘
        working-directory: bench
        shell: bash
        run: |
          set -eu
          uv sync --frozen
          uv run --no-sync python scripts/prepare_cloud_runner.py --controls-only --output "$RUNNER_TEMP/evidence/runner-preparation.json"
      - name: 显式下载同一公开仓库的完整前序资格 bundle
        if: inputs.resume_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resume_artifact }}
          run-id: ${{ inputs.resume_run_id }}
          repository: saya-ch/sayacode-bench
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/incoming
      - name: 当前 runner 实际网络隔离与清理探针，无模型请求
        working-directory: bench
        env:
          SAYACODE_BENCH_DOCKER_TESTS: '1'
          SAYACODE_BENCH_PROBE_OUTPUT: ${{ runner.temp }}/evidence/network-probe.json
        run: uv run --no-sync pytest tests/test_network.py::test_real_docker_network_isolation -q
      - name: 有限控制批次；只调用原生 oracle/nop 资格 CLI
        working-directory: bench
        shell: bash
        run: |
          set -eu
          resume=()
          if test -n "$RESUME_ARTIFACT"; then
            resume=(--resume-archive "$RUNNER_TEMP/incoming/bundle.tar.gz" --resume-sha256 "$RESUME_SHA")
          else
            resume=(--first-batch-history "$RUNNER_TEMP/evidence/actions-history.json" --run-number "$GITHUB_RUN_NUMBER")
          fi
          uv run --no-sync python -m scripts.qualify_cloud run \
            --study-id "$STUDY_ID" --source-sha "$SOURCE_SHA" \
            --workflow "$GITHUB_WORKSPACE/execution/.github/workflows/qualify-study.yml" \
            --image-os "$EXPECTED_IMAGE_OS" --image-version "$EXPECTED_IMAGE_VERSION" \
            --runner-preparation "$RUNNER_TEMP/evidence/runner-preparation.json" \
            --probe "$RUNNER_TEMP/evidence/network-probe.json" \
            --entry-report "$RUNNER_TEMP/evidence/qualification-entry.json" \
            --repository-metadata "$RUNNER_TEMP/evidence/repository.json" \
            --max-new-controls "$MAX_NEW_CONTROLS" --deadline-epoch "$JOB_DEADLINE_EPOCH" \
            "${resume[@]}" > "$RUNNER_TEMP/evidence/batch-entry.log" 2>&1
      - name: 正常 partial 与失败均保存完整原始 bundle
        id: archive
        if: always()
        working-directory: bench
        shell: bash
        run: |
          set -eu
          bundle="/tmp/sayacode-studies/$STUDY_ID"
          if test -f "$bundle/inputs/cloud-plan.json"; then
            mkdir -p "$bundle/host-evidence"
            cp -a "$RUNNER_TEMP/evidence" "$bundle/host-evidence/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            uv run --no-sync python -m scripts.qualify_cloud archive --study-id "$STUDY_ID" \
              --repository-metadata "$RUNNER_TEMP/evidence/repository.json" \
              --entry-report "$RUNNER_TEMP/evidence/qualification-entry.json" --output "$RUNNER_TEMP/archive"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 上传前再次实时核实指定仓库仍为公开
        id: guard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/archive-repository.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'archive-repository.json').read_text(encoding='utf-8'))
          assert d.get('full_name')=='saya-ch/sayacode-bench' and d.get('private') is False and d.get('visibility')=='public'
          PY
          echo "public=true" >> "$GITHUB_OUTPUT"
      - name: 公开三天保留官方控制材料，不自动删除
        if: always() && steps.guard.outputs.public == 'true' && steps.archive.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ inputs.study_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archive/
          if-no-files-found: error
          retention-days: 3
      - name: 恢复或准备失败仍保留本 job 诊断
        if: always() && steps.guard.outputs.public == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-${{ inputs.study_id }}-${{ github.run_id }}-${{ github.run_attempt }}-host
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 3
