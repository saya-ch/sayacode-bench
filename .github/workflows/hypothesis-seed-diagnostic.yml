name: 固定 Hypothesis seed 无模型诊断

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hypothesis-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          python-version: '3.13'
          enable-cache: true
      - name: 安装冻结评测依赖
        run: uv sync --frozen
      - name: 同一固定 seed 的三次全新 oracle
        shell: bash
        run: |
          timeout --signal=INT --kill-after=60s 25m \
            uv run --no-sync python -m scripts.reproduce_hypothesis_seed \
            --cache "$RUNNER_TEMP/hypothesis-seed-source" \
            --output "$RUNNER_TEMP/hypothesis-seed-diagnostic"
      - name: 保存最小诊断证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hypothesis-seed-diagnostic/public/
          if-no-files-found: warn
          retention-days: 14
