# 仅复制到指定私有执行仓库；本地 HTTP 模型替身，不读取供应商 Secret。
name: 真实容器分片链路验证

on:
  workflow_dispatch:
    inputs:
      public_source_sha:
        description: 已审阅的公开源码完整小写 SHA
        type: string
        required: true
      acknowledge_free_actions:
        description: 已核实仅使用免费 Actions；不是模型效果评测
        type: boolean
        default: false
        required: true
      probe_release_storage:
        description: 用合成小文件验证 workflow token 的私有 draft Release 上传与下载
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: private-shard-smoke
  cancel-in-progress: false

jobs:
  native-smoke:
    if: inputs.acknowledge_free_actions && github.repository == 'saya-ch/sayacode-bench-runs'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.public_source_sha }}
    steps:
      - name: 核实私有仓库和首次执行，不获取模型凭据
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/evidence"
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/evidence/repository.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'evidence/repository.json').read_text(encoding='utf-8'))
          assert d.get('full_name')=='saya-ch/sayacode-bench-runs' and d.get('private') is True and d.get('visibility')=='private'
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: execution
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: saya-ch/sayacode-bench
          ref: ${{ inputs.public_source_sha }}
          path: bench
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
          python-version: '3.13.12'
          enable-cache: false
      - name: 安装锁定依赖并准备宿主磁盘
        working-directory: bench
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          uv sync --frozen
          uv run --no-sync python scripts/prepare_cloud_runner.py --output "$RUNNER_TEMP/evidence/runner-preparation.json"
      - name: 核对精确生产输入
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'execution/artifacts'
          for name,sha in {
            'product-baseline.whl':'7892afcd50bd0ee786ed3ea5ba73015af32da11cd3eeff5474ce7e64d039dffe',
            'product-baseline-requirements.txt':'9eab06fb395d7b9bb84e14bfea83b79b4ab66d904c941c3b1606d39ed9712073',
          }.items():
            assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
          PY
      - name: 生产 Agent 与原生分片真实执行，仅使用 HTTP 替身
        working-directory: bench
        env:
          SAYACODE_BENCH_SHARD_SMOKE: '1'
          SAYACODE_BENCH_SMOKE_WHEEL: ${{ github.workspace }}/execution/artifacts/product-baseline.whl
          SAYACODE_BENCH_SMOKE_REQUIREMENTS: ${{ github.workspace }}/execution/artifacts/product-baseline-requirements.txt
          SAYACODE_BENCH_SMOKE_OUTPUT: ${{ runner.temp }}/evidence/native-smoke
        run: uv run --no-sync pytest tests/test_shards_docker.py -q -rA
      - name: 仅用合成文件核实原生 workflow token 的 Release 权限
        if: always() && inputs.probe_release_storage
        working-directory: bench
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from sayacode_bench.release_evidence import upload_archive,download_archive
          root=Path(os.environ['RUNNER_TEMP'])/'evidence/release-storage-probe'
          root.mkdir(exist_ok=False)
          source=root/'synthetic.bin'
          source.write_bytes(bytes(range(256))*1024+os.environ['GITHUB_RUN_ID'].encode('ascii'))
          arguments=dict(repository='saya-ch/sayacode-bench-runs',release_id=420920737,release_tag='research-evidence-20261022')
          manifest=upload_archive(source,work_dir=root/'upload',part_size_bytes=100000,**arguments)
          restored=download_archive(manifest,output_dir=root/'download',**arguments)
          digest=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(source)==digest(restored)
          (root/'verified-transfer.json').write_text(json.dumps({
              'schema_version':1,'synthetic_only':True,'model_requests':0,
              'authentication':'github.token','source_sha256':digest(source),
              'restored_sha256':digest(restored),'roundtrip_verified':True,
              'boundary':'验证 workflow token 的分片传输；不是完整研究 DAG 或模型成绩'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: 上传前核实私有性
        id: guard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/archive-repository.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'archive-repository.json').read_text(encoding='utf-8'))
          assert d.get('full_name')=='saya-ch/sayacode-bench-runs' and d.get('private') is True and d.get('visibility')=='private'
          PY
          echo "private=true" >> "$GITHUB_OUTPUT"
      - name: 保存真实原生证据，合成 smoke 不计模型效果
        if: always() && steps.guard.outputs.private == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-shard-smoke-${{ github.run_id }}-1
          path: ${{ runner.temp }}/evidence/
          retention-days: 3
          if-no-files-found: error
