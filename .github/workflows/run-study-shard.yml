# 复制到已核实的私有执行仓库；由冻结计划生成的 DAG 调用，不单独派发。
# 模板 SHA 先写入 runner_policy，再冻结 plan；生成 DAG 不参与自引用。
# 完整 raw bundle 交给固定私有 draft Release；确认后 Actions 只保小型交接。
# Release 失败或未确认时，Actions 仍保留当片原始现场三天。
# Release 不在当前 Actions 500 MB 存储池不代表永久免费，账户零美元预算不变。
# 不自动删除云 artifact。正式阶段仍需另获完整 scope、路由、费用与 Actions 授权。
# 宿主 cohort 仅匹配 ImageOS/ImageVersion/RUNNER_ARCH，不保证同一 CPU、内核或模型版本。
name: 冻结单片 source 与 pristine
on:
  workflow_call:
    inputs:
      contract_json:
        required: true
        type: string
      mode:
        required: true
        type: string
      shard_id:
        required: true
        type: string
      job_key:
        required: true
        type: string
      evidence_manifest_json:
        required: true
        type: string
      previous_receipt_sha256:
        default: ''
        type: string
      previous_ledger_sha256:
        default: ''
        type: string
    secrets:
      connection_keys_json:
        required: false
    outputs:
      evidence_manifest_json:
        value: ${{ jobs.run.outputs.evidence_manifest_json }}
      archive_sha256:
        value: ${{ jobs.run.outputs.archive_sha256 }}
      receipt_sha256:
        value: ${{ jobs.run.outputs.receipt_sha256 }}
      ledger_sha256:
        value: ${{ jobs.run.outputs.ledger_sha256 }}
      continuation_allowed:
        value: ${{ jobs.run.outputs.continuation_allowed }}
permissions:
  contents: write
  actions: read
jobs:
  run:
    if: github.repository == 'saya-ch/sayacode-bench-runs'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      evidence_manifest_json: ${{ steps.archive.outputs.evidence_manifest_json }}
      archive_sha256: ${{ steps.archive.outputs.archive_sha256 }}
      receipt_sha256: ${{ steps.archive.outputs.receipt_sha256 }}
      ledger_sha256: ${{ steps.archive.outputs.ledger_sha256 }}
      continuation_allowed: ${{ steps.archive.outputs.continuation_allowed }}
    env:
      SAYACODE_STUDY_CONTRACT: ${{ inputs.contract_json }}
      PUBLIC_SOURCE_SHA: ${{ fromJSON(inputs.contract_json).public_source_sha }}
      BUNDLE_ROOT: ${{ fromJSON(inputs.contract_json).bundle_root }}
      MASTER_SHA: ${{ fromJSON(inputs.contract_json).master_sha256 }}
      SHARD_ID: ${{ inputs.shard_id }}
      SAYACODE_ACTIONS_JOB_KEY: ${{ inputs.job_key }}
      MODE: ${{ inputs.mode }}
      SAYACODE_EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest_json }}
    steps:
      - name: 实时核实私有仓库、固定源码与首次执行
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = saya-ch/sayacode-bench-runs
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$PUBLIC_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$MODE" = shard || test "$MODE" = merge
          mkdir -p "$RUNNER_TEMP/evidence"
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/evidence/repository.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'evidence/repository.json').read_text(encoding='utf-8'))
          assert d.get('full_name') == 'saya-ch/sayacode-bench-runs'
          assert d.get('private') is True and d.get('visibility') == 'private'
          PY
          # 330 分钟软截止给原生收尾与完整归档留余量，不缩官方任务时限。
          echo "JOB_DEADLINE_EPOCH=$(( $(date +%s) + 19800 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: execution
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: saya-ch/sayacode-bench
          ref: ${{ fromJSON(inputs.contract_json).public_source_sha }}
          path: bench
          persist-credentials: false
      - name: 核验私有副本模板与冻结模板逐字节相同
        working-directory: bench
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          c=json.loads(os.environ['SAYACODE_STUDY_CONTRACT'])
          for p in [Path('.github/workflows/run-study-shard.yml'),Path(os.environ['GITHUB_WORKSPACE'])/'execution/.github/workflows/run-study-shard.yml']:
              assert hashlib.sha256(p.read_bytes()).hexdigest() == c['executor_workflow_sha256']
          PY
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
          python-version: '3.13.12'
          enable-cache: false
      - name: 安装冻结依赖并准备临时宿主磁盘
        working-directory: bench
        shell: bash
        run: |
          set -eu
          uv sync --frozen
          uv run --no-sync python scripts/prepare_cloud_runner.py --output "$RUNNER_TEMP/evidence/runner-preparation.json"
      - name: 从固定私有 draft Release 校验下载并按原路径恢复
        id: restore
        working-directory: bench
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: uv run --no-sync python -m scripts.generate_sharded_workflow restore --download-dir "$RUNNER_TEMP/incoming"
      - name: 当前 runner 真实网络探针及清理验证
        if: inputs.mode == 'shard'
        working-directory: bench
        env:
          SAYACODE_BENCH_DOCKER_TESTS: '1'
          SAYACODE_BENCH_PROBE_OUTPUT: ${{ runner.temp }}/evidence/network-probe.json
        run: uv run --no-sync pytest tests/test_network.py::test_real_docker_network_isolation -q
      - name: 无模型 Secret 复核恢复前缀与剩余片尚未开始
        if: fromJSON(inputs.contract_json).resume_receipt != null
        working-directory: bench
        shell: bash
        run: uv run --no-sync python -m scripts.generate_sharded_workflow resume-verify --shard-id "$SHARD_ID" --mode "$MODE"
      - name: 一片一配置，继承累计账本并调用原生研究 CLI
        if: inputs.mode == 'shard'
        working-directory: bench
        env:
          # 仅此步骤取得显式 key；非秘密参数一律读取冻结 master。
          SAYACODE_STUDY_CONNECTION_KEYS_JSON: ${{ secrets.connection_keys_json }}
          PREVIOUS_RECEIPT_SHA: ${{ inputs.previous_receipt_sha256 }}
          PREVIOUS_LEDGER_SHA: ${{ inputs.previous_ledger_sha256 }}
        shell: bash
        run: |
          uv run --no-sync python -m scripts.generate_sharded_workflow execute \
            --shard-id "$SHARD_ID" --probe "$RUNNER_TEMP/evidence/network-probe.json" \
            --runner-preparation "$RUNNER_TEMP/evidence/runner-preparation.json" \
            --deadline-epoch "$JOB_DEADLINE_EPOCH" \
            --previous-receipt-sha256 "$PREVIOUS_RECEIPT_SHA" \
            --previous-ledger-sha256 "$PREVIOUS_LEDGER_SHA"
      - name: 完整阶段严格归并，不改变 master 分母
        if: inputs.mode == 'merge'
        working-directory: bench
        env:
          PREVIOUS_RECEIPT_SHA: ${{ inputs.previous_receipt_sha256 }}
          PREVIOUS_LEDGER_SHA: ${{ inputs.previous_ledger_sha256 }}
        shell: bash
        run: |
          uv run --no-sync python -m scripts.generate_sharded_workflow merge \
            --previous-receipt-sha256 "$PREVIOUS_RECEIPT_SHA" \
            --previous-ledger-sha256 "$PREVIOUS_LEDGER_SHA"
      - name: 保留本 runner 准备与失败证据
        if: always() && steps.restore.outcome == 'success'
        shell: bash
        run: |
          set -eu
          mkdir -p "$BUNDLE_ROOT/orchestration"
          cp -a "$RUNNER_TEMP/evidence" "$BUNDLE_ROOT/orchestration/${SHARD_ID:-merged-$MASTER_SHA}-host"
      - name: 完整原始私有证据打包，失败不裁剪
        id: archive
        if: always() && steps.restore.outcome == 'success'
        working-directory: bench
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: uv run --no-sync python -m scripts.generate_sharded_workflow archive --output "$RUNNER_TEMP/archive" --shard-id "$SHARD_ID"
      - name: Release 已确认时只保小型交接；失败仍保存本片原始现场
        if: always() && steps.restore.outcome == 'success'
        env:
          RELEASE_TRANSFER_OUTCOME: ${{ steps.archive.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          temporary=Path(os.environ['RUNNER_TEMP'])
          bundle=Path(os.environ['BUNDLE_ROOT'])
          source=temporary/'archive'
          target=temporary/'actions-evidence'
          target.mkdir(exist_ok=False)
          def copy_file(path, destination):
              if path.is_file():
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(path,destination)
          for name in ('evidence-manifest.json','archive-receipt.json'):
              copy_file(source/name,target/name)
          confirmed=False
          try:
              receipt=json.loads((source/'archive-receipt.json').read_text(encoding='utf-8'))
              manifest=json.loads((source/'evidence-manifest.json').read_text(encoding='utf-8'))
              confirmed=(os.environ.get('RELEASE_TRANSFER_OUTCOME')=='success'
                  and receipt.get('transfer_status')=='completed'
                  and receipt['archive_sha256']==manifest['archive_sha256']
                  and receipt['archive_bytes']==manifest['archive_size'])
          except (OSError,ValueError,KeyError,TypeError):
              pass
          shard=os.environ.get('SHARD_ID','')
          if shard:
              current=bundle/'shards'/shard
              orchestration=bundle/'orchestration'/shard
              if confirmed:
                  for name in ('attempt.json','shard-receipt.json','run/summary.json','run/budget.json','run/progress.json','run/abort.json','run/invalid.json'):
                      copy_file(current/name,target/'shards'/shard/name)
                  for name in ('dispatch.json','network-probe.json','runner-preparation.json','image-preparation.json'):
                      copy_file(orchestration/name,target/'orchestration'/shard/name)
              else:
                  for path,parent in ((current,'shards'),(orchestration,'orchestration')):
                      if path.is_dir():
                          shutil.copytree(path,target/parent/shard,symlinks=True)
          else:
              contract=json.loads(os.environ['SAYACODE_STUDY_CONTRACT'])
              for name in ('manifest.json','summary.json','merge-receipt.json','missing.json','invalid.json'):
                  copy_file(bundle/contract['merge_relative_directory']/'final'/name,target/'merged'/name)
          (target/'evidence-policy.json').write_text(json.dumps({
              'release_transfer_confirmed':confirmed,
              'raw_current_shard_retained':bool(shard and not confirmed and current.is_dir()),
          },ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: 上传前再次核实仓库仍为私有
        id: guard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/archive-repository.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'archive-repository.json').read_text(encoding='utf-8'))
          assert d.get('full_name') == 'saya-ch/sayacode-bench-runs' and d.get('private') is True and d.get('visibility') == 'private'
          PY
          echo "private=true" >> "$GITHUB_OUTPUT"
      - name: 私有保留三天；额度与人工下载核验独立管理
        if: always() && steps.guard.outputs.private == 'true' && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: study-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.shard_id || 'merged' }}
          path: ${{ runner.temp }}/actions-evidence/
          if-no-files-found: error
          retention-days: 3
      - name: 准备或恢复失败仍保存无密钥的本机诊断
        if: always() && steps.guard.outputs.private == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: study-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.shard_id || 'merged' }}-host
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn
          retention-days: 3
