[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "sayacode-bench"
version = "0.1.0"
description = "基于公开基准与 Harbor 的 SAYACODE 评测和实验记录"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["harbor==0.24.0", "httpx==0.28.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1", "mypy==2.4.0"]

[project.scripts]
sayacode-bench = "sayacode_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sayacode_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
ignore_missing_imports = true
